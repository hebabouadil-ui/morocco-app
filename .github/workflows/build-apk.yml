name: Build Android APK

on:
  push:
    branches:
      - claude/3ds-survival-shooter-game-hHUgz
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node 18 directly — avoids setup-node cache auto-detection bug
      - name: Install Node.js 18 via NodeSource
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest has Android SDK pre-installed at $ANDROID_HOME
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" || echo "build-tools not listed"

      - name: Install npm dependencies
        working-directory: shooter-game
        run: npm install

      - name: Generate Android project
        working-directory: shooter-game
        run: npx cap add android

      - name: Sync web assets into Android
        working-directory: shooter-game
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: shooter-game/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: shooter-game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneShooter-Android-APK
          path: shooter-game/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
