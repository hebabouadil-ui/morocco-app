name: Build Android APK

on:
  push:
    branches:
      - claude/3ds-survival-shooter-game-hHUgz
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: shooter-game/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: shooter-game
        run: npm install

      - name: Generate Android project
        working-directory: shooter-game
        run: npx cap add android

      - name: Sync web assets into Android
        working-directory: shooter-game
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: shooter-game/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: shooter-game/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneShooter-Android-APK
          path: shooter-game/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
