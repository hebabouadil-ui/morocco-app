name: Deploy Game to GitHub Pages

on:
  push:
    branches:
      - claude/3ds-survival-shooter-game-hHUgz
  workflow_dispatch:

# Official permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload game folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./shooter-game/www

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
